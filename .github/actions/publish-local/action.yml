name: Publish package to local NIK feed
description: Publishes one validated OpenWrt IPK into the LAN-only unsigned OPKG feed on the self-hosted Windows/WSL runner.
inputs:
  package:
    description: OpenWrt package name, for example br-core or fr-wifi.
    required: true
  source_dir:
    description: Directory containing exactly one package IPK and package-build.json.
    required: false
    default: .artifacts/packages
  sdk_reference:
    description: Immutable OpenWrt SDK image reference used to generate the native OPKG index.
    required: true
  feed_root:
    description: Persistent Windows feed root as seen from WSL. Empty uses NIK_LOCAL_FEED_ROOT or /mnt/d/nik-feed.
    required: false
    default: ""
  signing_key_file:
    description: Deprecated compatibility input. The LAN development feed is intentionally unsigned.
    required: false
    default: ""
  channel:
    required: false
    default: dev
  openwrt_version:
    required: false
    default: "24.10.4"
  package_arch:
    required: false
    default: aarch64_cortex-a53
outputs:
  feed_path:
    description: Local live feed directory.
    value: ${{ steps.publish.outputs.feed_path }}
  feed_leaf:
    description: Relative OPKG feed leaf below the Windows HTTP root.
    value: ${{ steps.publish.outputs.feed_leaf }}
runs:
  using: composite
  steps:
    - id: publish
      shell: bash
      env:
        NIK_PUBLISH_PACKAGE: ${{ inputs.package }}
        NIK_PUBLISH_SOURCE_DIR: ${{ inputs.source_dir }}
        NIK_PUBLISH_SDK_REFERENCE: ${{ inputs.sdk_reference }}
        NIK_PUBLISH_FEED_ROOT: ${{ inputs.feed_root }}
        NIK_PUBLISH_CHANNEL: ${{ inputs.channel }}
        NIK_PUBLISH_OPENWRT_VERSION: ${{ inputs.openwrt_version }}
        NIK_PUBLISH_PACKAGE_ARCH: ${{ inputs.package_arch }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/publish-local-package.sh"
