name: Retire public package feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nik-feed-public-retirement
  cancel-in-progress: true

jobs:
  build:
    name: Publish package-free tombstone
    runs-on: [self-hosted, Linux, X64, nik-heavy]
    timeout-minutes: 10
    steps:
      - name: Build empty public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>NIK OpenWrt package feed</title></head>
          <body>
            <h1>NIK OpenWrt package feed</h1>
            <p>Runtime br-*/fr-* packages are no longer published on GitHub Pages.</p>
          </body>
          </html>
          EOF
          touch public/.nojekyll
          test "$(find public -type f -name '*.ipk' | wc -l)" -eq 0
          test ! -e public/dev

      - uses: actions/configure-pages@v5

      - name: Upload package-free Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Remove public OPKG payload
    needs: build
    runs-on: [self-hosted, Linux, X64, nik-heavy]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package-free Pages site
        id: deployment
        uses: actions/deploy-pages@v4
